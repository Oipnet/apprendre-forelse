framework:
    validation:
        # Enables validator auto-mapping support.
        # For instance, basic validation constraints will be inferred from Doctrine's metadata.
        #auto_mapping:
        #    App\Entity\: []

when@test:
    framework:
        validation:
            not_compromised_password: false

# Les comparaisons de dates (#[Assert\GreaterThanOrEqual('today')]…) lisent l'horloge de l'application
# (ClockInterface) plutôt que celle du système : un test qui fige le temps avec mockTime() les fige aussi.
# Symfony le prévoit, mais n'enregistre pas ces validateurs comme services, et les crée alors sans horloge.
services:
    Symfony\Component\Validator\Constraints\:
        resource: '../../vendor/symfony/validator/Constraints/{GreaterThan,GreaterThanOrEqual,LessThan,LessThanOrEqual}Validator.php'
        autowire: true
        autoconfigure: true
