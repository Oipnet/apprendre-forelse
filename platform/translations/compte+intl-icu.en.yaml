# English pages for signup, login, password reset, the account page and contact: see compte+intl-icu.fr.yaml for
# what each key is. Purchase keys (purchase., paiement.) fall back to French for now (see README.md).

commun:
    # The end of a list of alternatives: "A, B or C".
    liste_ou: "{debut} or {dernier}"

account:
    index:
        titre_page: "My account · {site}"
        titre: "My account"
        cohorte: " · cohort “{nom}”"
        # A track's labels (AccountProgress).
        etat:
            started: "In progress"
            done: "Completed"
            open: "Active access"
            free: "Free"
            not_started: "Not started"
        parcours_termine: "Track completed, well done."
        # HTML: rendered with |raw, the title escaped.
        prochain_exercice: "Next exercise: <strong>{titre}</strong>"
        premier_exercice: "First exercise: <strong>{titre}</strong>"
        revoir: "Review the track"
        reprendre: "Resume"
        commencer: "Start"
        un_compte_lie: "a linked account"
        confirmation:
            # HTML: rendered with |raw, the address escaped.
            texte: "<strong>Confirm your address {email}.</strong> The link is in the email you received when you signed up. Without a confirmed address, a receipt or a password reset link may never reach you."
            renvoyer: "Resend the link"
        indicateurs:
            xp: "XP"
            exercices: "{n, plural, one {exercise completed} other {exercises completed}}"
            acces: "{n, plural, one {active access} other {active accesses}}"
        progression:
            titre: "Pick up where I left off"
            tous_les_parcours: "All tracks →"
            en_cours: "In progress"
            exercices: "{faits} / {total} exercises"
            xp: "{xp} XP"
            # HTML: rendered with |raw.
            aucun: "No track started yet. <a href=\"{lien}\">Choose a track</a>: the first chapter is always free."
        profil:
            titre: "Profile"
            # HTML: rendered with |raw. "cohorte", "classement": oui or non.
            pseudo: "Your display name appears at the top of pages{cohorte, select, oui {, in your cohort’s progress view} other {}}{classement, select, oui { and on the <a href=\"{lien}\">leaderboard</a>} other {}}."
            # HTML: rendered with |raw; "fournisseurs": links, or account.index.un_compte_lie.
            confirmer_identite: "To change your address, first confirm your identity with {fournisseurs}."
            enregistrer: "Save"
        mot_de_passe:
            titre: "Password"
            minimum: "At least 8 characters"
            changer: "Change password"
            # HTML: rendered with |raw, the parameters escaped.
            sans: "You log in with {fournisseurs}. To also log in with your email address, choose a password via <a href=\"{lien}\">“Forgot your password?”</a>: the link will be sent to {email}."
        fournisseur:
            # HTML: rendered with |raw, the parameters escaped.
            lie: "Linked to the {fournisseur} account <strong>{identifiant}</strong> since {date}: you can log in with it."
            delier: "Unlink {fournisseur}"
            seul_moyen: "This is your only way to log in: to unlink it, choose a password first."
            proposer: "Link your {fournisseur} account to log in without a password."
            lier: "Link my {fournisseur} account"
        suppression:
            titre: "Delete my account"
            # HTML: rendered with |raw.
            texte: "Your account, your code, your progress, your feedback and your track access are erased right away. <strong>A track you bought will no longer be accessible</strong>; the purchase stays in our accounting records, with no link to you. This cannot be undone."
            annuler: "Cancel"
            mot_de_passe: "Your password, to confirm"
            # HTML: rendered with |raw; "fournisseurs": links, or account.index.un_compte_lie.
            confirmer_identite: "First confirm your identity with {fournisseurs}, then come back here."
            confirmer: "Delete permanently"
        acces:
            titre: "My access"
            aucun: "No access yet. The first chapter of every track is free."
            actif: "active"
            a_venir: "upcoming"
            termine: "ended"
            jusqu_au: "until {date}"
            a_vie: "lifetime"
        achats:
            titre: "My purchases"
            aucun: "None yet."
            facture: "Invoice (PDF)"
            recu: "Receipt"
        classement:
            titre: "Leaderboard"
            # HTML: rendered with |raw. "inscrit": oui or non.
            rang: "{inscrit, select, oui {You are} other {You would be}} <strong>{rang, number, ::group-off}<sup>{rang, selectordinal, one {st} two {nd} few {rd} other {th}}</sup></strong> on the overall leaderboard."
            aucun: "Complete an exercise to enter the leaderboard."
            inscrit: "You appear on it under your display name."
            absent: "You don’t appear on it: that’s up to you. Only your display name would be shown, with your XP and your completed exercises."
            voir: "See the leaderboard"
        pratique:
            titre: "Practice"
            reussis: "{n, plural, one {# exercise completed outside the tracks.} other {# exercises completed outside the tracks.}}"
            aucun: "Short exercises outside the tracks, each on one specific feature."
            voir: "See the exercises"

security:
    commun:
        # HTML: rendered with |raw.
        confidentialite: "Your address is only used for your account: <a href=\"{lien}\">privacy policy</a>."
        creer_mon_compte: "Create my account"
        # HTML: rendered with |raw.
        liste_attente: "No invitation code? <a href=\"{lien}\">Join the waitlist</a>: we’ll let you know when we open."
    login:
        titre_page: "Log in · {site}"
        titre: "Log in"
        email: "Email"
        mot_de_passe: "Password"
        rester_connecte: "Stay logged in on this device"
        mot_de_passe_oublie: "Forgot your password?"
        se_connecter: "Log in"
        continuer_avec: "Continue with {fournisseur}"
        # HTML: rendered with |raw.
        pas_de_compte: "No account yet? <a rel=\"nofollow\" href=\"{lien}\">Create one</a>."
    register:
        titre_page: "Sign up · {site}"
        titre: "Create an account"
        intro: "Free. Your progress and XP are saved."
        intro_invitation: "Invite-only beta. Your progress and XP are saved."
        inscription_avec: "Sign up with {fournisseur}"
        sans_mot_de_passe: "No password needed: we use the address the service has already verified."
        # HTML: rendered with |raw.
        deja_inscrit: "Already have an account? <a href=\"{lien}\">Log in</a>."
    oauth_register:
        titre_page: "Sign up with {fournisseur} · {site}"
        titre: "Create an account"
        # HTML: rendered with |raw, the parameters escaped.
        profil: "With your {fournisseur} account <strong>{identifiant}</strong>, at <strong>{email}</strong>. No password: you'll log in with {fournisseur}."
    reset_password:
        request:
            titre_page: "Forgot your password · {site}"
            titre: "Forgot your password?"
            texte: "Enter your account's email: you'll receive a link to choose a new password."
            envoyer: "Send me the link"
            # HTML: rendered with |raw.
            retour: "Remembered it? <a href=\"{lien}\">Log in</a>."
        check_email:
            titre_page: "Email sent · {site}"
            titre: "Check your inbox"
            # "duree": how long the link is valid, translated by ResetPasswordBundle ("1 hour").
            texte: "If an account exists with this address, we've just sent an email with a link to choose a new password. It's valid for {duree}."
            # HTML: rendered with |raw.
            rien_recu: "Nothing received? Check your spam folder, or <a href=\"{lien}\">request a new link</a> once that time has passed."
        reset:
            titre_page: "New password · {site}"
            titre: "New password"
            envoyer: "Save and log in"

contact:
    index:
        seo:
            titre: "Contact"
            description: "A question about a track, a purchase or an invoice, a problem on the site: write to us. A person reads every message and replies by email."
        surtitre: "Contact"
        titre: "Write to us"
        intro: "A question about a track, a purchase or an invoice, a problem on the site, an idea: a person reads every message and replies by email."
        raccourcis:
            # HTML: rendered with |raw.
            exercice: "<strong>A problem with an exercise?</strong> The “Feedback?” button in the exercise sends it to us with its context: that’s the fastest way."
            organisations: "<strong>Training a class or a team?</strong> <a href=\"{lien}\">Schools and companies</a> (in French): what we offer, and how to request a quote."
            compte: "<strong>Your account?</strong> Display name, address, password, invoices and deletion are managed from <a href=\"{lien}\">My account</a>."
        envoyer: "Send the message"
        contestation: "I am disputing the revocation of my certificate {code} ({parcours}).\nReason given: {motif}"
    form:
        # HTML: rendered with |raw.
        confidentialite: "Your message and address are only used to reply to you: <a href=\"{lien}\">privacy policy</a>."
        indisponible: "The form isn’t available on this instance: see the <a href=\"{lien}\">legal notice</a> to reach the publisher."
    quota: "Many messages in a short time from your connection: try again in an hour, or email us directly."

