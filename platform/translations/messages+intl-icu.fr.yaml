    moteur: 'Moteur {version} · <abbr title="GNU Affero General Public License v3.0 ou ultérieure">AGPL-3.0</abbr> · <a href="{depot}">code source</a>'

error:
    titre_page: "{titre} · {site}"
    accueil: "Retour à l'accueil"
    reprendre: "Reprendre où j'en étais"
    parcours: "Voir les parcours"
    404:
        titre: "Page introuvable"
        texte: "Cette adresse ne mène nulle part. Le lien est peut-être ancien, ou une lettre s'est glissée de travers."
    403:
        titre: "Accès refusé"
        texte: "Cette page existe, mais elle n'est pas ouverte à votre compte."
    429:
        titre: "Trop de requêtes"
        texte: "Vous allez plus vite que le serveur ne l'accepte. Patientez un instant, puis réessayez."
    503:
        titre: "Service indisponible"
        texte: "Le site est momentanément indisponible, sans doute le temps d'une mise à jour. Réessayez dans quelques minutes."
    # Les autres codes 4xx, et 5xx.
    4xx:
        titre: "Requête impossible"
        texte: "Le serveur n'a pas pu traiter cette requête."
    5xx:
        titre: "Une erreur est survenue"
        texte: "Quelque chose a cassé de notre côté. L'erreur est enregistrée ; réessayez dans un moment."

share:
    # Le titre des boutons de partage, suivi de deux-points ; « titre » : celui que la page donne, ou share.partager.
    titre: "{titre} :"
    partager: "Partager"
    natif: "Partager…"
    copier: "Copier le lien"
    # Les noms des réseaux, sur leurs boutons.
    reseau:
        linkedin: "LinkedIn"
        x: "X"
        bluesky: "Bluesky"
    # Ce qu'écrivent les images de partage (src/Share) : le surtitre, au-dessus du titre ; alt : leur texte alternatif.
    carte:
        pratique: "Pratique · {framework}"
        blog: "Blog"
        blog_sujet: "Blog · {sujet}"
        certificat: "Certificat de réussite · {nom}"
        alt: "{surtitre} : {titre}"
    # Le texte proposé avec le lien (X et Bluesky le préremplissent) ; {framework} vaut « Symfony 8.2 ».
    texte:
        pratique: "{framework} : « {titre} », un exercice court à faire dans le navigateur."
        pratique_reussie: "J'ai réussi l'exercice « {titre} » ({framework}), directement dans le navigateur."
        certificat: "J'ai terminé le parcours « {parcours} » sur {site} : {n, plural, one {# exercice réussi} other {# exercices réussis}}, chacun validé par des tests."

# Les filtres de format (src/Twig) : unités des durées estimées (|duree). Les nombres arrivent déjà écrits.
format:
    duree:
        minutes: "{minutes} min"
        heures: "{heures} h"
        heures_minutes: "{heures} h {minutes}"
