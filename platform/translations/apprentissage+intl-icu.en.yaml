# The playground APIs' refusals, read by the learner (the "detail" field of the JSON response).
api:
    connexion:
        exercice: Log in to access this exercise.
        progression: Log in to save your progress.
        mentor: Log in to ask the mentor.
        retour: Log in to send feedback.
    parcours_complet: "This exercise is part of the full track: buy the track to access it."
    import_trop_grand: "At most {max} exercises per import."
    mentor:
        inactif: The mentor is not enabled on this platform.
        revue_apres_reussite: "The code review comes once the exercise is completed: make the tests pass first."
        email_a_confirmer: "Confirm your email address to ask the mentor: the link is in the email you received when you signed up, and can be resent from your account."
        trop_d_appels: "The mentor has been working hard: try again a little later."
        budget_epuise: "The mentor has reached its daily limit on this platform: it will be back tomorrow."
        sans_reponse: "The mentor could not answer: {raison}"

# The texts the server sends to the playground (PlaygroundConfigFactory, ExercisePayloadFactory).
playground:
    retour_pratique: Practice
    framework:
        symfony:
            demarrage: "Symfony runs entirely in your browser, thanks to PHP compiled to WebAssembly."
            decompression: Unpacking the Symfony project
        laravel:
            demarrage: "Laravel runs entirely in your browser, thanks to PHP compiled to WebAssembly."
            decompression: Unpacking the Laravel project
        docker:
            demarrage: "Docker is simulated in your browser: images, containers and Compose, and the PHP in your containers really runs in WebAssembly."
            decompression: Unpacking the project
        nuxt:
            demarrage: "Nuxt is simulated in your browser: your pages are rendered on the server, then hydrated, just like with nuxi dev."
            decompression: Unpacking the project
