            # HTML : rendu avec |raw.
            rien_recu: "Rien reçu ? Vérifiez vos indésirables, ou <a href=\"{lien}\">refaites une demande</a> une fois ce délai passé."
        reset:
            titre_page: "Nouveau mot de passe · {site}"
            titre: "Nouveau mot de passe"
            envoyer: "Enregistrer et me connecter"

contact:
    index:
        seo:
            titre: "Contact"
            description: "Une question sur un parcours, un achat ou une facture, un problème sur le site : écrivez-nous, une personne lit chaque message et vous répond par email."
        surtitre: "Contact"
        titre: "Nous écrire"
        intro: "Une question sur un parcours, un achat ou une facture, un problème sur le site, une idée : une personne lit chaque message et vous répond par email."
        raccourcis:
            # HTML : rendu avec |raw.
            exercice: "<strong>Un souci sur un exercice ?</strong> Le bouton « Un avis ? », dans l'exercice, nous l'envoie avec son contexte : c'est le plus rapide."
            organisations: "<strong>Former une classe ou une équipe ?</strong> <a href=\"{lien}\">Écoles et entreprises</a> : ce qui existe, et comment demander un devis."
            compte: "<strong>Votre compte ?</strong> Pseudo, adresse, mot de passe, factures et suppression se gèrent depuis <a href=\"{lien}\">Mon compte</a>."
        envoyer: "Envoyer le message"
        # Le début du message pour contester un certificat révoqué, depuis sa page.
        contestation: "Je conteste la révocation de mon certificat {code} ({parcours}).\nMotif indiqué : {motif}"
    form:
        # HTML : rendu avec |raw.
        confidentialite: "Votre message et votre adresse servent seulement à vous répondre : <a href=\"{lien}\">politique de confidentialité</a>."
        indisponible: "Le formulaire n'est pas disponible sur cette instance : consultez les <a href=\"{lien}\">mentions légales</a> pour joindre l'éditeur."
    # QuotaExceeded (ContactInbox).
    quota: "Beaucoup de messages en peu de temps depuis votre connexion : réessayez dans une heure, ou écrivez-nous directement par email."

purchase:
    # Le nom du produit sur la page de paiement Stripe, le reçu et la facture.
    produit: "Parcours « {parcours} » (accès à vie)"
    checkout:
        titre_page: "Acheter « {parcours} » · {site}"
        prix_normal: "Prix normal"
        ttc: "TTC"
        acces_a_vie: "Accès à vie au parcours et à ses mises à jour."
        fondateur:
            sans_places: "Prix fondateur."
            sans_places_date: "Prix fondateur, jusqu'au {date}."
            places: "Prix fondateur, encore {places, plural, one {# place} other {# places}}."
            places_date: "Prix fondateur, encore {places, plural, one {# place} other {# places}}, jusqu'au {date}."
        cohorte: "Tarif de votre cohorte « {nom} »."
        tva: "La TVA de votre pays est calculée à l'étape suivante, sur la page de paiement sécurisée de Stripe ; le prix affiché la comprend."
        payer: "Payer {prix}"
        retour: "Retour au parcours"
    thanks:
        titre_page: "Merci · {site}"
        paye:
            titre: "Merci !"
            texte: "Votre accès au parcours est ouvert, à vie. Un email de confirmation vient de partir."
            texte_parcours: "Votre accès au parcours « {parcours} » est ouvert, à vie. Un email de confirmation vient de partir."
            aller: "Aller au parcours →"
            recu: "Voir le reçu"
        en_attente:
            titre: "Paiement en cours de confirmation"
            texte: "Stripe nous confirme le paiement dans un instant : cette page se met à jour toute seule."
            # HTML : rendu avec |raw.
            rien_ne_bouge: "Rien ne bouge au bout d'une minute ? Si vous avez abandonné le paiement, rien n'a été débité. Sinon, <a href=\"{lien_page}\">rechargez la page</a> un peu plus tard : l'accès apparaîtra aussi dans <a href=\"{lien_compte}\">votre compte</a>."
        abandonne:
            titre: "Paiement non abouti"
            texte: "Le paiement n'a pas abouti : rien n'a été débité et l'accès n'est pas ouvert."
            reessayer: "Réessayer le paiement"
        conteste:
            titre: "Paiement contesté"
            texte: "Le paiement est contesté auprès de votre banque : l'accès au parcours est suspendu le temps de la procédure, votre progression est conservée. Il se rouvre si la contestation est close en faveur de l'achat."
        rembourse:
            titre: "Achat remboursé"
            texte: "Cet achat a été remboursé ; l'accès au parcours est fermé, votre progression est conservée."

