            aucun: "Réussissez un exercice pour entrer dans le classement."
            inscrit: "Vous y apparaissez sous votre pseudo."
            absent: "Vous n'y apparaissez pas : c'est à vous de le choisir. Seul votre pseudo serait affiché, avec votre XP et vos exercices réussis."
            voir: "Voir le classement"
        pratique:
            titre: "Pratique"
            reussis: "{n, plural, one {# exercice réussi hors parcours.} other {# exercices réussis hors parcours.}}"
            aucun: "De courts exercices hors parcours, sur une fonctionnalité précise."
            voir: "Voir les exercices"

security:
    commun:
        # HTML : rendu avec |raw.
        confidentialite: "Votre adresse ne sert qu'à votre compte : <a href=\"{lien}\">politique de confidentialité</a>."
        creer_mon_compte: "Créer mon compte"
        # HTML : rendu avec |raw.
        liste_attente: "Pas de code d'invitation ? <a href=\"{lien}\">Laissez votre adresse sur la liste d'attente</a> : vous serez prévenu à l'ouverture."
    login:
        titre_page: "Connexion · {site}"
        titre: "Connexion"
        email: "Email"
        mot_de_passe: "Mot de passe"
        rester_connecte: "Rester connecté·e sur cet appareil"
        mot_de_passe_oublie: "Mot de passe oublié ?"
        se_connecter: "Se connecter"
        continuer_avec: "Continuer avec {fournisseur}"
        # HTML : rendu avec |raw.
        pas_de_compte: "Pas encore de compte ? <a rel=\"nofollow\" href=\"{lien}\">Créez-en un</a>."
    register:
        titre_page: "Créer un compte · {site}"
        titre: "Créer un compte"
        intro: "Gratuit. Votre progression et votre XP sont sauvegardées."
        intro_invitation: "Bêta sur invitation. Votre progression et votre XP sont sauvegardées."
        inscription_avec: "S'inscrire avec {fournisseur}"
        sans_mot_de_passe: "Sans mot de passe : votre adresse est celle que le service a vérifiée."
        # HTML : rendu avec |raw.
        deja_inscrit: "Déjà inscrit ? <a href=\"{lien}\">Connectez-vous</a>."
    oauth_register:
        titre_page: "Créer un compte avec {fournisseur} · {site}"
        titre: "Créer un compte"
        # HTML : rendu avec |raw, les paramètres échappés.
        profil: "Avec votre compte {fournisseur} <strong>{identifiant}</strong>, à l'adresse <strong>{email}</strong>. Pas de mot de passe : vous vous connecterez avec {fournisseur}."
    reset_password:
        request:
            titre_page: "Mot de passe oublié · {site}"
            titre: "Mot de passe oublié"
            texte: "Indiquez l'email de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe."
            envoyer: "Recevoir le lien"
            # HTML : rendu avec |raw.
            retour: "Il vous revient ? <a href=\"{lien}\">Connectez-vous</a>."
        check_email:
            titre_page: "Email envoyé · {site}"
            titre: "Regardez votre boîte mail"
