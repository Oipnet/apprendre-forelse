        indicateurs:
            xp: "XP"
            exercices: "{n, plural, one {exercice réussi} other {exercices réussis}}"
            acces: "{n, plural, one {accès actif} other {accès actifs}}"
        progression:
            titre: "Reprendre où j'en suis"
            tous_les_parcours: "Tous les parcours →"
            en_cours: "En cours"
            exercices: "{faits} / {total} exercices"
            xp: "{xp} XP"
            # HTML : rendu avec |raw.
            aucun: "Aucun parcours ouvert pour l'instant. <a href=\"{lien}\">Choisir un parcours</a> : le premier chapitre est toujours gratuit."
        profil:
            titre: "Profil"
            # HTML : rendu avec |raw. « cohorte », « classement » : oui ou non.
            pseudo: "Votre pseudo s'affiche en haut des pages{cohorte, select, oui {, dans le suivi de votre cohorte} other {}}{classement, select, oui { et dans le <a href=\"{lien}\">classement</a>} other {}}."
