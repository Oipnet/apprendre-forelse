            # HTML : rendu avec |raw, l'adresse échappée.
            texte: "<strong>Confirmez votre adresse {email}.</strong> Le lien est dans l'email reçu à l'inscription. Sans adresse confirmée, un reçu ou un lien de mot de passe oublié risque de ne jamais vous parvenir."
