# Le compte de l'apprenant (account/), la connexion et l'inscription (security/), le contact (contact/) et l'achat
# (purchase/) : gabarits, formulaires, messages flash et sujets des e-mails de ces pages (voir README.md).

commun:
    # La fin d'une liste d'alternatives : « A, B ou C ».
    liste_ou: "{debut} ou {dernier}"

account:
    index:
        titre_page: "Mon compte · {site}"
        titre: "Mon compte"
        cohorte: " · cohorte « {nom} »"
        # Les étiquettes d'un parcours (AccountProgress).
        etat:
            started: "En cours"
            done: "Terminé"
            open: "Accès actif"
            free: "Gratuit"
            not_started: "Non démarré"
        parcours_termine: "Parcours terminé, bravo."
        # HTML : rendu avec |raw, le titre échappé.
        prochain_exercice: "Prochain exercice : <strong>{titre}</strong>"
        premier_exercice: "Premier exercice : <strong>{titre}</strong>"
        revoir: "Revoir le parcours"
        reprendre: "Reprendre"
        commencer: "Commencer"
        un_compte_lie: "un compte lié"
