            sans: "Vous vous connectez avec {fournisseurs}. Pour pouvoir aussi vous connecter avec votre adresse, choisissez un mot de passe avec <a href=\"{lien}\">« Mot de passe oublié ? »</a> : le lien part à {email}."
        appareils:
            titre: "Appareils mémorisés"
            texte: "« Rester connecté » vous garde connecté·e 30 jours sur un appareil. Un appareil perdu, un ordinateur partagé : vous pouvez annuler cela partout, sur cet appareil compris. Chacun vous redemandera de vous connecter."
            oublier: "Oublier tous mes appareils"
        fournisseur:
            # HTML : rendu avec |raw, les paramètres échappés.
            lie: "Lié au compte {fournisseur} <strong>{identifiant}</strong> depuis le {date} : vous pouvez vous connecter avec."
            delier: "Délier {fournisseur}"
            seul_moyen: "C'est votre seul moyen de connexion : pour le délier, choisissez d'abord un mot de passe."
            proposer: "Liez votre compte {fournisseur} pour vous connecter sans mot de passe."
            lier: "Lier mon compte {fournisseur}"
        suppression:
            titre: "Supprimer mon compte"
            # HTML : rendu avec |raw.
            texte: "Votre compte, votre code, votre progression, vos avis et vos accès aux parcours sont effacés tout de suite. <strong>Un parcours acheté ne sera plus accessible</strong> ; l'achat reste dans notre comptabilité, sans lien avec vous. C'est irréversible."
            annuler: "Annuler"
            mot_de_passe: "Votre mot de passe, pour confirmer"
            # HTML : rendu avec |raw ; « fournisseurs » : des liens, ou account.index.un_compte_lie.
            confirmer_identite: "Confirmez d'abord votre identité avec {fournisseurs}, puis revenez ici."
            confirmer: "Supprimer définitivement"
        acces:
            titre: "Mes accès"
            aucun: "Aucun accès pour l'instant. Le premier chapitre de chaque parcours est gratuit."
            actif: "actif"
            a_venir: "à venir"
            termine: "terminé"
            jusqu_au: "jusqu'au {date}"
            a_vie: "à vie"
        achats:
            titre: "Mes achats"
            aucun: "Aucun pour l'instant."
            facture: "Facture (PDF)"
            recu: "Reçu"
        classement:
            titre: "Classement"
            # HTML : rendu avec |raw. « inscrit » : oui ou non.
