# Le certificat de réussite (templates/certificate/, CertificateController, CertificateClaimType) et les fiches de
# cours en PDF (templates/chapter/pdf.html.twig, booklet.html.twig, App\Export\LessonPdf) : voir README.md.
# Les messages *_html contiennent du HTML et se rendent avec |raw, paramètres échappés (|e).

flash:
  connexion: 'Connectez-vous pour obtenir votre certificat.'
  incomplet: 'Le certificat se délivre une fois tous les exercices du parcours réussis.'
  pret: 'Votre certificat est prêt. Bravo !'

seo:
  titre: 'Certificat « {parcours} » de {titulaire}'
  description: '{titulaire} a terminé le parcours « {parcours} » : {exercices} exercices réussis.'

claim:
