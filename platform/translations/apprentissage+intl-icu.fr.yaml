    # Le lien de retour de la barre, pour un exercice de la Pratique (pour un parcours : son titre).
    retour_pratique: Pratique
    # Les profils de framework du moteur (src/Content/Framework/Profiles) : la note affichée pendant le démarrage,
    # et l'étape de décompression du projet.
    framework:
        symfony:
            demarrage: "Symfony tourne entièrement dans votre navigateur, grâce à PHP compilé en WebAssembly."
            decompression: Décompression du projet Symfony
        laravel:
            demarrage: "Laravel tourne entièrement dans votre navigateur, grâce à PHP compilé en WebAssembly."
            decompression: Décompression du projet Laravel
        docker:
            demarrage: "Docker est simulé dans votre navigateur : images, conteneurs et Compose, et le PHP de vos conteneurs s'exécute pour de vrai en WebAssembly."
            decompression: Décompression du projet
        nuxt:
            demarrage: "Nuxt est simulé dans votre navigateur : vos pages sont rendues côté serveur puis hydratées, comme avec nuxi dev."
            decompression: Décompression du projet
