# SEO tags of the pages served in English (home, blog, Practice, tracks, concepts): see seo+intl-icu.fr.yaml. Other keys fall back to French.

commun:
    accueil: Home

blog:
    titre: Blog
    titre_marque: "Blog | {marque}"
    description: "Articles that start from an exercise and go further: what the framework really does, where it stops, and how to use it in production. Plus behind the scenes of the platform."
    nombre_articles: "{n} articles."
    fil_ariane: Blog

pratique:
    fil_ariane: Practice
    sujet_par_defaut: the frameworks
    titre_marque: "What’s new in {sujet}, as short exercises | {marque}"
    titre: "What’s new in {sujet}, as short exercises"
    titre_court: "New framework features as short exercises"
    description: "Short exercises, separate from the tracks: code written the old way, to rewrite with the framework's new feature, right in the browser."
    exercice:
        titre: "{framework}: {fonctionnalite} – exercise"
        titre_court: "{framework}: {fonctionnalite}"
        complement: "A short {framework} Practice exercise, to do in the browser."

catalogue:
    sujet_par_defaut: web development
    titre_marque: "Tracks to learn {sujet} by coding | {marque}"
    titre: "Learn {sujet} by coding: the tracks"
    titre_court: "The tracks: learn by coding"
    description: "Learn {sujet} by writing code in your browser: a real project, a live preview, and tests that check every goal."
    complement: First chapter free with an account.
    liste: The tracks
    fil_ariane: Tracks

parcours:
    titre_public: "{framework} online course {public}"
    titre: "{framework} online course: {parcours}"
    chiffres: "{chapitres, plural, one {# chapter} other {# chapters}}, {exercices, plural, one {# exercise} other {# exercises}}, {gratuit, select, oui {free} other {first chapter free}}."
    niveau:
        beginner: Beginner
        intermediate: Intermediate
        advanced: Advanced

notions:
    titre: Concepts practised in exercises
    titre_marque: "Concepts practised in exercises | {marque}"
    description: "{n} web development concepts, each with the exercises that practise it: you write the code in your browser, and tests tell you whether it is right."
    fil_ariane: Concepts

# La page d'une notion ; {n} : ses exercices de parcours et de Pratique.
notion:
    titre_marque: "{notion}: {n} exercises to practise it | {marque}"
    titre: "{notion}: {n} exercises to practise it"
    titre_court: "{notion} in exercises"
    description: "The {n} exercises that work on {notion}: each one sets a problem to solve by writing code in your browser, checked by tests."
    complement: "{n} exercises to practise it, in the browser."

contenu:
    notions_framework: "{notions} in {framework} – {libelle}"
    notion: "{notion} – {libelle}"

chapitre:
    titre: "{chapitre} – chapter {numero}, {framework} track"
    description: "Chapter {numero} of the {parcours} track: {notions}. {n, plural, one {# exercise to do by writing code, checked by tests.} other {# exercises to do by writing code, checked by tests.}}"

exercice:
    libelle: "exercise: {exercice}"
    titre: "{exercice} – {framework} exercise"
    complement: "An exercise from the “{chapitre}” chapter, {parcours} track."

bac_a_sable:
    index:
        titre: "Online PHP playground: plain PHP, Symfony and Laravel"
        description: "Write PHP, Symfony or Laravel code in your browser, with nothing to install and no account, and share it with a simple link."
        fil_ariane: Playground
    symfony:
        titre: "Online Symfony playground"
        description: "A full Symfony 8 project in your browser: controllers, Twig, console. Try an idea and share your code with a link, no account needed."
        fil_ariane: Symfony playground
    laravel:
        titre: "Online Laravel playground"
        description: "A full Laravel 13 project in your browser: routes, Blade, artisan. Try an idea and share your code with a link, no account needed."
        fil_ariane: Laravel playground
    php:
        titre: "Online PHP playground, no framework"
        description: "A PHP 8.4 project in your browser, with no framework: index.php, autoloaded classes, console scripts. Test PHP code and share it with a link, no account needed."
        fil_ariane: PHP playground

compte:
    connexion: "Log in to pick up your tracks where you left off, and find your completed exercises and your place on the leaderboard."
    inscription: "Create your account to keep your progress, follow the tracks and join the leaderboard. Exercises run in your browser, nothing to install."
    mot_de_passe_oublie: "Forgot your password? Enter your email address and you will receive a link to choose a new one."
    classement: "The learners' leaderboard: XP earned by passing the exercises of the tracks and of Practice, this month or since the beginning."
