framework:
    validation:
        # Enables validator auto-mapping support.
        # For instance, basic validation constraints will be inferred from Doctrine's metadata.
        #auto_mapping:
        #    App\Entity\: []

        # Un nouveau mot de passe publié dans une fuite connue est refusé (App\Validator\StrongPassword). Une instance
        # sans accès sortant vers api.pwnedpasswords.com le coupe avec PASSWORD_BREACH_CHECK=0.
        not_compromised_password:
            enabled: '%env(bool:PASSWORD_BREACH_CHECK)%'

when@test:
    framework:
        # Have I Been Pwned n'est jamais appelé par les tests : une API simulée répond (App\Tests\PwnedPasswordsMock).
        http_client:
            mock_response_factory: App\Tests\PwnedPasswordsMock
