framework:
    rate_limiter:
        # Le mentor (revue de code, erreurs expliquées) : chaque appel coûte, par apprenant.
        mentor:
            policy: sliding_window
            limit: 40
            interval: '1 hour'
        # Formulaire de contact et demandes des écoles : par adresse IP.
        contact:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Liens de confirmation d'adresse (inscription, changement d'adresse) : chaque envoi est un email, par compte.
        email_confirmation:
            policy: fixed_window
            limit: 5
            interval: '1 hour'
        # Inscriptions refusées parce que l'email a déjà un compte, par adresse IP. Au-delà, toute inscription
        # est refusée depuis cette adresse : c'est ce qui ralentit qui teste une liste d'emails. Seuls les refus
        # comptent, pour qu'une classe entière s'inscrive derrière la même adresse IP.
        registration_duplicate:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
        # Email « quelqu'un a voulu créer un compte avec votre adresse », par compte : pas de quoi inonder sa boîte.
        registration_notice:
            policy: fixed_window
            limit: 1
            interval: '1 day'
        # Rapports de la politique de sécurité du contenu (/csp-rapport), par adresse IP : de quoi voir un problème,
        # pas de quoi remplir les journaux.
        csp_report:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
        # Retours sur les exercices (bouton « Un avis ? »), par compte.
        feedback:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

when@test:
    framework:
        cache:
            pools:
                # En mémoire : les compteurs ne survivent pas d'un test à l'autre.
                cache.rate_limiter:
                    adapter: cache.adapter.array
