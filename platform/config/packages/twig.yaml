twig:
    file_name_pattern: '*.twig'
    # Les formulaires du site, en classes du thème default (un thème le remplace comme tout gabarit).
    form_themes: ['form/theme.html.twig']
    globals:
        # Version du moteur (fichier VERSION), affichée en pied de page : indispensable pour
        # qu'une instance auto-hébergée sache ce qu'elle fait tourner.
        moteur_version: '@App\Version'
        # Google Search Console (méthode « balise HTML ») : vide, pas de balise.
        google_site_verification: '%env(GOOGLE_SITE_VERIFICATION)%'
        # Page « Auto-hébergement » : servie seulement si le thème actif en fournit le gabarit (self_hosting.enabled).
        self_hosting: '@App\Instance\SelfHostingPage'
        # Le blog : sans article paru dans les packs, pas de lien (blog.open).
        blog: '@App\Content\Blog'
        # Thème de l'instance : nom, puce, couleurs, images, textes de l'accueil (voir App\Theme\Theme).
        theme: '@App\Theme\Theme'
        # L'ancien nom du même service, pour les gabarits surchargés par les instances d'avant le renommage
        # (BRANDING_DIR/templates/) : retiré en 4.0. Les gabarits du moteur n'utilisent que « theme ».
        marque: '@App\Theme\Theme'
        # Balises de la page publique en cours (voir App\Seo\Page et l'attribut #[Seo]).
        seo: '@App\Seo\PageSeo'
        # Mesure d'audience (Umami auto-hébergé) : sans les deux variables ANALYTICS_*, aucune balise.
        analytics: '@App\Instance\Analytics'
        # Connexion avec GitHub, Google ou LinkedIn : un fournisseur sans ses identifiants (GITHUB_CLIENT_ID…) n'a
        # aucun bouton (oauth.enabled).
        oauth: '@App\Account\Oauth\OauthProviders'

when@test:
    twig:
        strict_variables: true
