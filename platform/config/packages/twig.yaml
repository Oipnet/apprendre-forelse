twig:
    file_name_pattern: '*.twig'
    globals:
        # Version du moteur (fichier VERSION), affichée en pied de page : indispensable pour
        # qu'une instance auto-hébergée sache ce qu'elle fait tourner.
        moteur_version: '@App\Version'
        # Google Search Console (méthode « balise HTML ») : vide, pas de balise.
        google_site_verification: '%env(GOOGLE_SITE_VERIFICATION)%'
        # Page « Auto-hébergement », réservée à l'instance de Forelse (SELF_HOSTING_PAGE).
        self_hosting: '@App\Instance\SelfHostingPage'
        # Identité de l'instance : nom, puce, couleurs, images, textes de l'accueil (voir App\Instance\Branding).
        marque: '@App\Instance\Branding'
        # Balises de la page publique en cours (voir App\Seo\Page et l'attribut #[Seo]).
        seo: '@App\Seo\PageSeo'
        # Mesure d'audience (Umami auto-hébergé) : sans les deux variables ANALYTICS_*, aucune balise.
        analytics: '@App\Instance\Analytics'
        # Connexion avec GitHub, Google ou LinkedIn : un fournisseur sans ses identifiants (GITHUB_CLIENT_ID…) n'a
        # aucun bouton (oauth.enabled).
        oauth: '@App\Account\Oauth\OauthProviders'

when@test:
    twig:
        strict_variables: true
