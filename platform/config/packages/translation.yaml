framework:
    default_locale: fr
    # Les langues servies par le site : le français partout, l'anglais pour le blog seulement (/en/blog). Les textes
    # sont sortis des gabarits (translations/, voir son README) : une autre langue n'a plus qu'à fournir ses fichiers.
    enabled_locales: [fr, en]
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: [fr]
        providers:
