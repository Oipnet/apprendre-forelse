# Production (VPS). L'image est construite et publiée sur GHCR par l'intégration continue, puis
# ce fichier est copié dans /srv/forelse/compose.yaml et les conteneurs mis à jour (job « Déployer »
# de .github/workflows/ci.yml). Variables : /srv/forelse/.env.
#
# Pour votre propre instance, partez plutôt de auto-hebergement/ (guide, compose.yaml et .env.example).
services:
  app:
    image: ${APP_IMAGE:-ghcr.io/oipnet/apprendre-forelse:edge}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      SANDBOX_URL: ${SANDBOX_URL:?SANDBOX_URL manquant dans .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DATABASE_URL: postgresql://formation:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/formation?serverVersion=17&charset=utf8
      REGISTRATION_INVITE_ONLY: ${REGISTRATION_INVITE_ONLY:-1}
      SELF_HOSTING_PAGE: ${SELF_HOSTING_PAGE:-1}
      SEARCH_INDEXING: ${SEARCH_INDEXING:-1}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      # Mesure d'audience. Le traceur est servi par le site lui-même (docker/Caddyfile) ; l'identifiant
      # vient du site créé dans le tableau de bord d'Umami. Vide : aucune balise, rien n'est mesuré.
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
      # Nom d'hôte qui sert le tableau de bord d'Umami (ex. https://suivi.example.org, avec son enregistrement
      # DNS). Vide : il n'est pas exposé, et se consulte par un tunnel SSH.
      ANALYTICS_SERVER_NAME: ${ANALYTICS_SERVER_NAME:-http://127.0.0.1:9998}
      # Packs chargés (chemins dans le conteneur, séparés par des virgules). /packs = le volume ci-dessous ;
      # ajouter /app/examples/packs pour proposer aussi le parcours de démonstration, ouvert aux visiteurs.
      CONTENT_PACKS_PATHS: ${CONTENT_PACKS_PATHS:-/packs}
      # Fichiers à télécharger (archives déposées par la CI du dépôt de contenu, ex. la boutique
      # vulnérable). /downloads = le volume ci-dessous ; servis par /telechargements aux comptes connectés.
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-/downloads}
      # Identité de l'instance : nom, couleurs, images, gabarits (voir README, « Habiller son instance »).
      # /marque = le volume ci-dessous. Vide : la marque du moteur.
      BRANDING_DIR: ${BRANDING_DIR:-/marque}
      # Sans SMTP, les emails (mot de passe oublié) ne partent pas : à renseigner dans .env.
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-Forelse <ne-pas-repondre@forelse.fr>}
      REGISTRATION_ALERT_EMAIL: ${REGISTRATION_ALERT_EMAIL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Paiement des parcours : vide, pas de bouton d'achat actif (voir .env.example).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TAX_CODE: ${STRIPE_TAX_CODE:-txcd_10000000}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      LEGAL_PUBLISHER_NAME: ${LEGAL_PUBLISHER_NAME:-}
      LEGAL_PUBLISHER_LEGAL_FORM: ${LEGAL_PUBLISHER_LEGAL_FORM:-}
      LEGAL_PUBLISHER_REGISTRATION: ${LEGAL_PUBLISHER_REGISTRATION:-}
      LEGAL_PUBLISHER_VAT: ${LEGAL_PUBLISHER_VAT:-}
      LEGAL_PUBLISHER_ADDRESS: ${LEGAL_PUBLISHER_ADDRESS:-}
      LEGAL_PUBLISHER_EMAIL: ${LEGAL_PUBLISHER_EMAIL:-}
      LEGAL_PUBLISHER_PHONE: ${LEGAL_PUBLISHER_PHONE:-}
      LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR:-}
      LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-}
      LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS:-}
      LEGAL_HOST_PHONE: ${LEGAL_HOST_PHONE:-}
      LEGAL_MEDIATOR_NAME: ${LEGAL_MEDIATOR_NAME:-}
      LEGAL_MEDIATOR_URL: ${LEGAL_MEDIATOR_URL:-}
      LEGAL_REFUND_DAYS: ${LEGAL_REFUND_DAYS:-}
      # Devis de cohorte : prix par apprenant et par parcours (TTC, en centimes), puis barème dégressif.
      COHORT_UNIT_PRICE: ${COHORT_UNIT_PRICE:-3000}
      COHORT_TIERS: ${COHORT_TIERS:-1:100,10:70,30:50}
    volumes:
      # Secret de l'application (généré au premier démarrage) et certificats Let's Encrypt de Caddy.
      - data:/data
      - config:/config
      # Packs de contenu (dépôt apprendre-forelse-contenu), déposés par rsync. Vide : pack de démonstration.
      - ${PACKS_DIR:-./packs}:/packs:ro
      # Archives à télécharger (déposées par rsync depuis la CI du contenu). Vide : aucun téléchargement.
      - ${DOWNLOADS_HOST_DIR:-./downloads}:/downloads:ro
      # Identité de l'instance (marque.yaml, images, gabarits). Vide : la marque du moteur.
      - ${BRANDING_HOST_DIR:-./marque}:/marque:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: formation
      POSTGRES_USER: formation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formation -d formation"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Mesure d'audience : combien de visiteurs, sur quelles pages, venus d'où. Umami ne pose pas de cookie
  # et ne conserve pas d'adresse IP : rien à faire accepter par un bandeau de consentement. Tout reste sur
  # ce serveur, rien ne part chez un tiers.
  #
  # Première mise en route : ouvrir le tableau de bord (tunnel SSH, ou ANALYTICS_SERVER_NAME), se connecter
  # avec admin / umami, CHANGER CE MOT DE PASSE, créer le site, puis reporter son identifiant dans
  # ANALYTICS_WEBSITE_ID et ANALYTICS_SCRIPT_URL=/mesure/traceur.js — et `docker compose up -d`.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      umami-base:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://formation:${POSTGRES_PASSWORD:?}@db:5432/umami
      DATABASE_TYPE: postgresql
      # Pas d'APP_SECRET : Umami le dérive de DATABASE_URL. Changer le mot de passe PostgreSQL déconnecte
      # donc du tableau de bord, sans rien perdre des mesures.
      # Le traceur est servi sous ce nom, et non /script.js, que les bloqueurs de publicités connaissent.
      TRACKER_SCRIPT_NAME: traceur.js
      DISABLE_TELEMETRY: "1"
      LOCALE: ${ANALYTICS_LOCALE:-fr-FR}
      # Au-delà, les visites détaillées sont effacées (les totaux, eux, restent).
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-365}
    ports:
      # Sur la boucle locale du serveur seulement : rien n'est exposé à l'internet (ni au pare-feu, qui
      # ne voit pas 127.0.0.1), et le tableau de bord se consulte par un tunnel SSH :
      #   ssh -L 8081:localhost:3000 <le serveur>   puis http://localhost:8081
      # La collecte, elle, ne passe pas par ici : Caddy la relaie depuis le conteneur « app ».
      - "127.0.0.1:${ANALYTICS_LOCAL_PORT:-3000}:3000"

  # Umami tient ses tables dans sa propre base, sur le PostgreSQL déjà là. Le script d'initialisation de
  # l'image officielle ne tourne qu'à la toute première création du volume : cette base-ci n'existerait
  # donc jamais sur un serveur déjà en service. Ce conteneur la crée si elle manque, puis s'arrête.
  umami-base:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    entrypoint: ["sh", "-c"]
    command:
      - psql -h db -U formation -d formation -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1 || psql -h db -U formation -d formation -c 'CREATE DATABASE umami'
    restart: "no"

volumes:
  data:
  config:
  db:
