# Instance auto-hébergée du moteur : la plateforme (FrankenPHP/Caddy + Symfony) et sa base PostgreSQL.
# Mode d'emploi : README.md de ce dossier. Réglages : fichier .env à côté de celui-ci (modèle : .env.example).
#
#   docker compose up -d            démarrer, ou appliquer une modification du .env
#   docker compose pull && docker compose up -d     mettre à jour
# Rotation des journaux, pour chaque service (logging: *logging) : cinq fichiers de 10 Mo au plus par conteneur.
# Sans elle, le pilote json-file de Docker grossit sans limite et finit par remplir le disque.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/oipnet/apprendre-forelse:2}
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-environment
      # Emails en file d'attente dans la base, envoyés par le service « worker » ci-dessous.
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      # Installations d'environnements confiées au service « empaqueteur » ci-dessous, loin des secrets.
      ENVIRONMENTS_BUILDER: ${ENVIRONMENTS_BUILDER:-empaqueteur}
      # Politique de sécurité du contenu : 1 = signaler seulement (« CSP : … » dans les journaux), 0 = bloquer.
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-1}
      # Migrations de la base au démarrage (1, par défaut), ou jouées à part avant le `up` (0) : voir le README.
      MIGRATIONS_AT_STARTUP: ${MIGRATIONS_AT_STARTUP:-1}
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      SANDBOX_URL: ${SANDBOX_URL:?SANDBOX_URL manquant dans .env}
      # Adresses écoutées par Caddy. Vide : APP_URL et SANDBOX_URL, avec HTTPS automatique. « :80 » derrière un
      # reverse proxy ou pour un essai local.
      SERVER_NAME: ${SERVER_NAME:-}
      # Reverse proxy : adresses dont on croit les en-têtes X-Forwarded-* (private_ranges = réseaux privés).
      SYMFONY_TRUSTED_PROXIES: ${SYMFONY_TRUSTED_PROXIES:-}
      # Vide : généré au premier démarrage et conservé dans le volume data.
      APP_SECRET: ${APP_SECRET:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      DATABASE_URL: postgresql://formation:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/formation?serverVersion=17&charset=utf8
      CONTENT_PACKS_PATHS: ${CONTENT_PACKS_PATHS:-/packs}
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-/downloads}
      # Identité de l'instance : nom, couleurs, images, gabarits (voir README, « Habiller son instance »).
      # /marque = le volume ci-dessous. Vide : la marque du moteur.
      BRANDING_DIR: ${BRANDING_DIR:-/marque}
      # Environnements installés depuis un dépôt Git par l'administration (/admin → Environnements).
      # Vide : la fonctionnalité est absente. Empaqueter exécute le code du dépôt sur ce serveur.
      INSTALLED_ENVIRONMENTS_DIR: ${INSTALLED_ENVIRONMENTS_DIR:-/environnements}
      # Hôtes acceptés pour ces dépôts, séparés par des virgules. Vide : tous les hôtes en https.
      ENVIRONMENT_SOURCES_ALLOWLIST: ${ENVIRONMENT_SOURCES_ALLOWLIST:-}
      # 1 : au démarrage, installer les environnements que les packs déclarent et qui manquent.
      # En tâche de fond : la plateforme sert ses pages pendant ce temps.
      ENVIRONMENTS_AUTO_INSTALL: ${ENVIRONMENTS_AUTO_INSTALL:-0}
      # Devis de cohorte : prix par apprenant et par parcours (TTC, en centimes), puis barème dégressif.
      COHORT_UNIT_PRICE: ${COHORT_UNIT_PRICE:-3000}
      COHORT_TIERS: ${COHORT_TIERS:-1:100,10:70,30:50}
      REGISTRATION_INVITE_ONLY: ${REGISTRATION_INVITE_ONLY:-0}
      # Page de présentation propre à l'instance de Forelse : laissez-la éteinte.
      SELF_HOSTING_PAGE: ${SELF_HOSTING_PAGE:-0}
      REGISTRATION_ALERT_EMAIL: ${REGISTRATION_ALERT_EMAIL:-}
      SEARCH_INDEXING: ${SEARCH_INDEXING:-1}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      # Mesure d'audience (facultative, voir « Savoir qui visite le site » dans le README).
      ANALYTICS_SCRIPT_URL: ${ANALYTICS_SCRIPT_URL:-}
      ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
      ANALYTICS_SERVER_NAME: ${ANALYTICS_SERVER_NAME:-http://127.0.0.1:9998}
      # Suivi des erreurs (facultatif, voir .env.example). Vide : rien ne part.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-ne-pas-repondre@example.com}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Appels au mentor par jour pour toute l'instance ; atteint, il se tait jusqu'au lendemain.
      MENTOR_DAILY_LIMIT: ${MENTOR_DAILY_LIMIT:-500}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      AI_MODEL_POST: ${AI_MODEL_POST:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TAX_CODE: ${STRIPE_TAX_CODE:-txcd_10000000}
      LEGAL_PUBLISHER_NAME: ${LEGAL_PUBLISHER_NAME:-}
      LEGAL_PUBLISHER_LEGAL_FORM: ${LEGAL_PUBLISHER_LEGAL_FORM:-}
      LEGAL_PUBLISHER_REGISTRATION: ${LEGAL_PUBLISHER_REGISTRATION:-}
      LEGAL_PUBLISHER_VAT: ${LEGAL_PUBLISHER_VAT:-}
      LEGAL_PUBLISHER_ADDRESS: ${LEGAL_PUBLISHER_ADDRESS:-}
      LEGAL_PUBLISHER_EMAIL: ${LEGAL_PUBLISHER_EMAIL:-}
      LEGAL_PUBLISHER_PHONE: ${LEGAL_PUBLISHER_PHONE:-}
      LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR:-}
      LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-}
      LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS:-}
      LEGAL_HOST_PHONE: ${LEGAL_HOST_PHONE:-}
      LEGAL_MEDIATOR_NAME: ${LEGAL_MEDIATOR_NAME:-}
      LEGAL_MEDIATOR_URL: ${LEGAL_MEDIATOR_URL:-}
      LEGAL_REFUND_DAYS: ${LEGAL_REFUND_DAYS:-}
    volumes: &app-volumes
      # Secret de l'application, sessions, certificats HTTPS.
      - data:/data
      - config:/config
      # Packs de contenu, en lecture seule. Dossier vide : le pack de démonstration est chargé.
      - ${PACKS_DIR:-./packs}:/packs:ro
      # Archives à télécharger (facultatif) : déposez-y vos .zip, servis par /telechargements.
      - ${DOWNLOADS_HOST_DIR:-./downloads}:/downloads:ro
      # Votre marque (facultatif) : marque.yaml, vos images, vos gabarits. Vide : la marque du moteur.
      - ${BRANDING_HOST_DIR:-./marque}:/marque:ro
      # Environnements installés depuis un dépôt Git, et leurs archives.
      - environnements:/environnements
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    # Plafonds : un service qui s'emballe ne fait pas tomber les autres (réglables dans .env).
    mem_limit: ${APP_MEM_LIMIT:-1536m}
    pids_limit: 512

  # Envoi des emails, hors des requêtes : la plateforme les dépose dans la base (Messenger), ce service les
  # envoie. Un serveur SMTP lent ou en panne ne bloque plus l'inscription, et l'email part à son retour
  # (nouvelles tentatives pendant deux heures, puis `bin/console messenger:failed:retry` dans ce conteneur).
  # Même image, mêmes réglages que « app » ; il redémarre de lui-même toutes les heures pour rester léger.
  worker:
    image: ${APP_IMAGE:-ghcr.io/oipnet/apprendre-forelse:2}
    logging: *logging
    restart: unless-stopped
    depends_on:
      # Après les migrations, que lance le démarrage de « app » (dont la table de la file d'attente).
      app:
        condition: service_healthy
    environment: *app-environment
    volumes: *app-volumes
    # pcntl (chargée pour cette commande seulement) lui fait entendre le SIGTERM d'un arrêt : il finit le message en
    # cours et s'arrête, au lieu d'être tué au bout de 10 s. init : un vrai processus n°1, qui relaie les signaux.
    init: true
    command: ["php", "-d", "extension=pcntl", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    # Le contrôle de santé de l'image interroge Caddy, qui ne tourne pas ici.
    healthcheck:
      disable: true
    mem_limit: 256m
    pids_limit: 64

  # Installe et empaquette les environnements d'exécution (/admin → Environnements) : `git clone` puis
  # `composer install` sur un dépôt tiers, donc son code. Il tourne ici, et non dans « app » : ni les clés
  # (Stripe, Anthropic, APP_SECRET), ni la base, ni le réseau des autres services — seulement Internet, pour
  # cloner et télécharger les dépendances, et le volume des environnements, qu'il partage avec « app ».
  empaqueteur:
    image: ${APP_IMAGE:-ghcr.io/oipnet/apprendre-forelse:2}
    logging: *logging
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL:?APP_URL manquant dans .env}
      SANDBOX_URL: ${SANDBOX_URL:?SANDBOX_URL manquant dans .env}
      # Rien de secret : de quoi démarrer Symfony, sans rien atteindre.
      APP_SECRET: empaqueteur-sans-secret
      DATABASE_URL: postgresql://aucun:aucun@aucune-base:5432/aucune?serverVersion=17
      MAILER_DSN: null://null
      MESSENGER_TRANSPORT_DSN: sync://
      CONTENT_PACKS_PATHS: ${CONTENT_PACKS_PATHS:-/packs}
      INSTALLED_ENVIRONMENTS_DIR: ${INSTALLED_ENVIRONMENTS_DIR:-/environnements}
      ENVIRONMENT_SOURCES_ALLOWLIST: ${ENVIRONMENT_SOURCES_ALLOWLIST:-}
      ENVIRONMENTS_AUTO_INSTALL: ${ENVIRONMENTS_AUTO_INSTALL:-0}
    volumes:
      - ${PACKS_DIR:-./packs}:/packs:ro
      - environnements:/environnements
    networks:
      - empaquetage
    # Même raison que « worker » : pcntl et init, pour s'arrêter dès le SIGTERM.
    init: true
    command: ["php", "-d", "extension=pcntl", "bin/console", "app:environnement:empaqueteur"]
    healthcheck:
      disable: true
    # Un `composer install` gourmand ne fait pas tomber le reste du serveur.
    mem_limit: ${EMPAQUETEUR_MEM_LIMIT:-1g}
    pids_limit: 256
    cpus: 1

  db:
    image: postgres:17-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: formation
      POSTGRES_USER: formation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formation -d formation"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Mesure d'audience, facultative : combien de visiteurs, sur quelles pages, venus d'où. Umami ne pose
  # pas de cookie et ne conserve aucune adresse IP, donc pas de bandeau de consentement à afficher, et
  # tout reste sur votre serveur. Ces deux services ne démarrent qu'avec le profil « mesure » :
  #   docker compose --profile mesure up -d
  # (ou COMPOSE_PROFILES=mesure dans .env, pour ne plus avoir à le taper). Sans lui, rien ne tourne
  # et rien n'est mesuré. Mise en route détaillée dans le README.
  umami:
    # Version épinglée : une nouvelle version d'Umami migre sa base, elle se choisit (et se sauvegarde avant),
    # elle n'arrive pas avec un déploiement du moteur. Changer ce numéro, puis `docker compose up -d umami`.
    image: ghcr.io/umami-software/umami:3.4.0
    logging: *logging
    mem_limit: ${UMAMI_MEM_LIMIT:-512m}
    pids_limit: 128
    profiles: ["mesure"]
    restart: unless-stopped
    depends_on:
      umami-base:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://formation:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}@db:5432/umami
      DATABASE_TYPE: postgresql
      # Pas d'APP_SECRET : Umami le dérive de DATABASE_URL. Changer le mot de passe PostgreSQL déconnecte
      # donc du tableau de bord, sans rien perdre des mesures.
      # Le traceur est servi sous ce nom, et non /script.js, que les bloqueurs de publicités connaissent.
      TRACKER_SCRIPT_NAME: traceur.js
      DISABLE_TELEMETRY: "1"
      LOCALE: ${ANALYTICS_LOCALE:-fr-FR}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-365}
    ports:
      # Sur la boucle locale du serveur seulement : rien n'est exposé à l'internet (ni au pare-feu, qui
      # ne voit pas 127.0.0.1). Le tableau de bord se consulte par un tunnel SSH, voir le README.
      # La collecte, elle, ne passe pas par ici : Caddy la relaie depuis le conteneur « app ».
      - "127.0.0.1:${ANALYTICS_LOCAL_PORT:-3000}:3000"

  # Umami tient ses tables dans sa propre base, sur le PostgreSQL déjà là. Le script d'initialisation de
  # l'image officielle ne tourne qu'à la création du volume : sur une instance déjà en service, cette
  # base n'existerait jamais. Ce conteneur la crée si elle manque, puis s'arrête.
  umami-base:
    image: postgres:17-alpine
    logging: *logging
    profiles: ["mesure"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    entrypoint: ["sh", "-c"]
    command:
      - psql -h db -U formation -d formation -tAc "SELECT 1 FROM pg_database WHERE datname='umami'" | grep -q 1 || psql -h db -U formation -d formation -c 'CREATE DATABASE umami'
    restart: "no"

volumes:
  data:
  environnements:
  config:
  db:

networks:
  # Le réseau par défaut relie app, la base et les autres. L'empaqueteur n'a que celui-ci : Internet, rien d'autre.
  default:
  empaquetage:
