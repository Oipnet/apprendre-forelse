; Réglages de production (complètent php.ini-production).
expose_php = Off
memory_limit = 256M
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code de l'image ne change pas : inutile de vérifier les dates des fichiers.
opcache.validate_timestamps = 0
; Classes du framework et du conteneur chargées une fois au démarrage de FrankenPHP, partagées par toutes les
; requêtes. La liste est écrite par cache:clear, que docker-entrypoint.sh lance avant FrankenPHP : cache vide,
; rien n'est préchargé. En CLI, opcache est désactivé et ce réglage sans effet. preload_user ne sert que si
; le conteneur tourne en root (PHP refuse alors de précharger sans lui).
opcache.preload = /app/platform/config/preload.php
opcache.preload_user = formation

session.use_strict_mode = 1

; Fuseau horaire d'affichage (admin, exports) : APP_TIMEZONE, « UTC » par défaut (voir compose.yaml).
; Les dates sont stockées sans fuseau : changer cette valeur décale la lecture des lignes existantes.
date.timezone = ${APP_TIMEZONE}
