id: demo
title: Pack de démonstration
description: Deux exercices de parcours et un exercice de Pratique, pour découvrir le format des packs et tester une installation.
version: 1.0.0
# Version(s) du moteur avec lesquelles ce pack fonctionne (syntaxe de Composer : ^1.2, >=1.2 <2.0).
# Un pack distribué à part devrait la déclarer : le moteur refuse de le charger s'il ne la satisfait pas.
# Le pack de démonstration est livré avec le moteur, donc toujours à jour : la clé est inutile ici.
# moteur: '^1.0'
license: AGPL-3.0-or-later
# Le plus souvent, un pack porte son décor : <pack>/environments/<id>/environment.yaml, à côté des
# parcours. Rien à déclarer — le moteur le trouve parce que le pack est monté.
#
# La clé ci-dessous sert à l'autre cas : un décor trop gros pour vivre dans le pack, ou partagé entre
# plusieurs packs, que le moteur va chercher dans un dépôt Git (voir README, « Un pack apporte ses
# environnements »). Le dépôt doit porter un environment.yaml dont l'« id » est celui déclaré ici.
# Le pack de démonstration n'utilise que les environnements livrés avec le moteur : rien de tout cela
# ne lui sert.
# environments:
#   - id: ma-boutique
#     depot: https://github.com/mon-org/env-ma-boutique.git
#     ref: v1.2.0          # facultatif : branche ou étiquette, sinon la branche par défaut
#     dossier: symfony     # facultatif : sous-dossier, si le dépôt porte plusieurs environnements
tracks:
  - decouverte
