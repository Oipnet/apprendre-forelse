# Mises à jour des dépendances du moteur, chaque semaine. Les mineures et correctifs d'un même dossier
# arrivent groupés dans une seule pull request ; une version majeure a toujours la sienne.
#
# Volontairement absents :
# - environments/* : les versions de framework que les exercices enseignent (Symfony 8, Laravel 13…). Monter
#   de version change ce que dit le cours : cela se décide avec le contenu, pas par un robot.
# - packages/simulateur-nuxt/conformite/* : le vrai Nuxt y est épinglé, comme référence du simulateur.
# - les fichiers compose (déploiement, auto-hébergement) : une majeure de Postgres y demande une migration
#   des données. Voir l'épinglage des services du déploiement avant de les confier à Dependabot.
version: 2

updates:
  - package-ecosystem: composer
    directory: /platform
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /packages/simulateur-docker
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /playground
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/simulateur-nuxt
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]
    # Le simulateur imite le vrai Nuxt : ces paquets sont les siens, à la version exacte qu'installe la
    # référence de conformite/reference (aujourd'hui Nuxt 4.5.2). Les monter seul ferait diverger le
    # simulateur de ce qu'il imite, et les tests de conformité comparent justement les deux. Ils bougent
    # quand la référence bouge, à la main. Restent confiés à Dependabot : l'outillage du paquet
    # (TypeScript, Vitest, rolldown, @types/node) et ce qui n'appartient qu'au simulateur (fflate, sucrase).
    ignore:
      - dependency-name: "@unhead/vue"
      - dependency-name: "@vitest/spy"
      - dependency-name: "@vue/test-utils"
      - dependency-name: acorn
      - dependency-name: buffer
      - dependency-name: chai
      - dependency-name: cookie-es
      - dependency-name: cookie-es-nuxt
      - dependency-name: devalue
      - dependency-name: es-module-lexer
      - dependency-name: fnv1a-64
      - dependency-name: happy-dom
      - dependency-name: hookable
      - dependency-name: klona
      - dependency-name: object-identity
      - dependency-name: ofetch
      - dependency-name: ohash
      - dependency-name: ufo
      - dependency-name: unhead
      - dependency-name: unrouting
      - dependency-name: unstorage
      - dependency-name: vue
      - dependency-name: vue-router

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # La majeure de Node se change dans .nvmrc et dans le Dockerfile ensemble (la CI vérifie qu'ils
      # concordent) : une pull request qui ne toucherait que le Dockerfile échouerait à coup sûr.
      - dependency-name: node
        update-types: [version-update:semver-major]
