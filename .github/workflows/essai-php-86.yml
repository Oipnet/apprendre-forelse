name: Essai PHP 8.6

# Essai temporaire (branche de travail, retiré avant la revue) : les exercices de Pratique sur notre build
# php-wasm 8.6 (branche forelse-php-8-6-v3.1.65 du fork Oipnet/wordpress-playground), installé à la place de
# @php-wasm/node-8-5. Le contenu de main plus les 12 exercices PHP 8.6 de la PR contenu #124.

on:
  push:
    branches: [claude/project-thread-4yl9f5]
    paths: [.github/workflows/essai-php-86.yml, playground/spike/php86/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: moteur
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CONTENU_DEPOT }}
          token: ${{ secrets.CONTENU_TOKEN }}
          path: contenu
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CONTENU_DEPOT }}
          token: ${{ secrets.CONTENU_TOKEN }}
          ref: claude/project-thread-3gvrr2
          path: contenu-86
          persist-credentials: false

      - name: Exercices PHP 8.6 de la PR contenu #124
        run: cp -r contenu-86/pratique/practice/php-8-6-* contenu/pratique/practice/

      - name: Build php-wasm 8.6
        run: git clone --depth 1 -b forelse-php-8-6-v3.1.65 https://github.com/Oipnet/wordpress-playground.git php86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, zip
          coverage: none

      - name: Environnements
        run: |
          envs=$(grep -h '^environment:' contenu/pratique/practice/*/exercise.yaml | awk '{print $2}' | sort -u)
          for env in $envs; do moteur/environments/bin/build-env.sh "$env" "$RUNNER_TEMP/envs"; done

      - name: Dépendances du playground, avec PHP 8.6 à la place de 8.5
        working-directory: moteur/playground
        run: |
          npm ci
          rm -rf node_modules/@php-wasm/node-8-5/asyncify node_modules/@php-wasm/node-8-5/jspi
          cp -r "$GITHUB_WORKSPACE/php86/node-8-6/asyncify" "$GITHUB_WORKSPACE/php86/node-8-6/jspi" node_modules/@php-wasm/node-8-5/
          node -e "import('@php-wasm/node').then(async ({loadNodeRuntime}) => { const {PHP} = await import('@php-wasm/universal'); const php = new PHP(await loadNodeRuntime('8.5', {emscriptenOptions: {processId: 1}})); console.log((await php.run({code: '<?php echo PHP_VERSION;'})).text); process.exit(0); })"

      - name: Exercices en PHP 8.6
        working-directory: moteur/playground
        env:
          ENVS: ${{ runner.temp }}/envs
          CONTENU: ${{ github.workspace }}/contenu
          MOTEUR_ENVS: ${{ github.workspace }}/moteur/environments
        run: npx vitest run --config spike/php86/vitest.config.ts
