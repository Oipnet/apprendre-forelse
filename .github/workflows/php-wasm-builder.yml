name: Essai PHP 8.5

# Essai temporaire (branche de travail, retiré avant la revue) : joue les scénarios Symfony/Laravel et les exercices de
# Pratique sur @php-wasm 8.5 (playground/spike/builder).

on:
  push:
    branches: [claude/project-thread-hlrniq]
    paths: [.github/workflows/php-wasm-builder.yml, playground/spike/builder/**]

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: moteur
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.CONTENU_DEPOT }}
          token: ${{ secrets.CONTENU_TOKEN }}
          path: contenu
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, zip
          coverage: none

      - name: Environnements
        run: for env in symfony-8 symfony-8-doctrine symfony-8-2-dev symfony-8-2-doctrine-dev laravel-13; do moteur/environments/bin/build-env.sh "$env" "$RUNNER_TEMP/envs"; done

      - name: Dépendances du playground
        run: npm ci
        working-directory: moteur/playground

      - name: Scénarios et exercices en PHP 8.5
        working-directory: moteur/playground
        env:
          ENVS: ${{ runner.temp }}/envs
          CONTENU: ${{ github.workspace }}/contenu
        run: npx vitest run --config spike/builder/vitest.config.ts
